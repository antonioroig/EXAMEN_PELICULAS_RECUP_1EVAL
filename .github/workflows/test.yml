name: Tests Cypress - EXAMEN DWEC

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Usamos la acción oficial de Cypress: instala, arranca servidor y ejecuta
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          # Si necesitas arrancar tu app antes de testear, descomenta la siguiente línea:
          # start: npm start 
          # wait-on: 'http://localhost:3000'
          browser: chrome
          headless: true # Fuerza el modo sin cabezal

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 5